name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runbook-contract:
    name: Runbook Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Verify readiness runbook contract
      run: python scripts/verify-runbook-contract.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 3.8/3.9 removed: requires-python is now >=3.10 and the code uses
        # 3.10+ syntax, so those cells could never install/pass. The floor
        # lives in pyproject.toml -- keep this matrix in sync with it.
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        pytest tests/ -m "not integration and not e2e and not slow" -v --cov=agent_factory --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run ruff
      run: ruff check agent_factory/ tests/
    
    - name: Run black check
      run: black --check agent_factory/ tests/ || echo "⚠️  Formatting check had differences (non-blocking)"
    
    - name: Run mypy
      run: mypy agent_factory/

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run dependency CVE audit (pip-audit)
      # Replaces `safety check`: that subcommand was deprecated upstream and
      # unsupported after 2024-06-01, so `pip install safety && safety check`
      # pulled a safety version whose `check` no longer works. This step had
      # been failing on every run, which also blocked the two steps below it.
      # pip-audit is the maintained equivalent; run locally: clean.
      run: |
        python -m pip install --upgrade pip
        python -m pip install pip-audit
        # Two pitfalls, both hit on earlier runs:
        #  - auditing the live environment fails with
        #      "agent-factory: distribution marked as editable"
        #    even WITH --skip-editable (that flag does not apply to
        #    environment-mode scans in pip-audit 2.10), and
        #  - pointing pip-audit at this repo as a project fails because
        #    agent-factory is not published to PyPI.
        # Audit a frozen requirements list instead, with the editable
        # self-reference removed by pip itself.
        python -m pip freeze --exclude-editable > /tmp/requirements.audit.txt
        pip-audit --strict --progress-spinner off -r /tmp/requirements.audit.txt
    
    - name: Run bandit
      run: |
        pip install bandit
        bandit -r agent_factory/ -f json -o bandit-report.json
    
    - name: Check for secrets
      run: |
        pip install detect-secrets
        detect-secrets scan --baseline .secrets.baseline

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, lint, security]
    steps:
    - uses: actions/checkout@v3
    
    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
