name: Deploy Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to deploy (optional)'
        required: false

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=agent_factory --cov-report=xml || echo "⚠️  Tests had issues (non-blocking for preview)"
        continue-on-error: true
      
      - name: Run linting
        run: |
          ruff check agent_factory/ tests/ || echo "⚠️  Linting had issues (non-blocking for preview)"
          black --check agent_factory/ tests/ || echo "⚠️  Formatting had issues (non-blocking for preview)"
        continue-on-error: true

  deploy-preview:
    name: Deploy to Vercel Preview
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event.pull_request.number != '' || github.event_name == 'workflow_dispatch'
    outputs:
      preview_url: ${{ steps.vercel-deploy.outputs.preview_url || steps.check-credentials.outputs.preview_url }}
      has_token: ${{ steps.check-credentials.outputs.has_token }}
    environment:
      name: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      
      - name: Check Vercel Credentials
        id: check-credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "preview_url=https://[project-name].vercel.app" >> $GITHUB_OUTPUT
            echo "⚠️  VERCEL_TOKEN secret not set. Preview deployment skipped."
            echo "To enable Vercel preview deployments:"
            echo "1. Get Vercel token: https://vercel.com/account/tokens"
            echo "2. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID to GitHub Secrets"
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        if: steps.check-credentials.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Vercel CLI
        if: steps.check-credentials.outputs.has_token == 'true'
        run: npm install --global vercel@latest
      
      - name: Pull Vercel Environment Information
        if: steps.check-credentials.outputs.has_token == 'true'
        id: vercel-pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" || {
            echo "⚠️  Failed to pull Vercel config. Check VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets."
            exit 1
          }
      
      - name: Build Project
        if: steps.check-credentials.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel build --token="$VERCEL_TOKEN" || {
            echo "✗ Build failed. Check build logs above."
            exit 1
          }
      
      - name: Deploy to Vercel Preview
        if: steps.check-credentials.outputs.has_token == 'true'
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | head -1)
          
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "⚠️  Failed to extract deployment URL. Check Vercel logs above."
            DEPLOYMENT_URL="https://[project-name].vercel.app (check Vercel dashboard)"
          fi
          
          echo "preview_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "✓ Preview deployed: $DEPLOYMENT_URL"
      
      - name: Comment PR with Preview URL
        if: steps.check-credentials.outputs.has_token == 'true' && github.event.pull_request.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = '${{ steps.vercel-deploy.outputs.preview_url }}';
            const deploymentStatus = '${{ job.status }}';
            
            const body = `## 🚀 Vercel Preview Deployment
            
            **Preview URL:** ${previewUrl}
            
            **Status:** ${deploymentStatus === 'success' ? '✅ Deployed' : '❌ Failed'}
            
            **Deployment Details:**
            - Branch: \`${{ github.head_ref }}\`
            - Commit: \`${{ github.event.pull_request.head.sha }}\`
            - Workflow: [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            **Note:** This preview will be automatically cleaned up when the PR is closed.
            `;
            
            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Vercel Preview Deployment')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body,
              });
            }

  preview-smoke-tests:
    name: Preview Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-preview
    if: success() && needs.deploy-preview.outputs.has_token == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Wait for preview deployment
        run: |
          echo "Waiting for preview deployment to be ready..."
          sleep 30
      
      - name: Run smoke tests
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview_url }}
        run: |
          if [ -z "$PREVIEW_URL" ] || [ "$PREVIEW_URL" == "https://[project-name].vercel.app (check Vercel dashboard)" ]; then
            echo "⚠️  Preview URL not available. Skipping smoke tests."
            exit 0
          fi
          
          echo "Testing preview deployment: $PREVIEW_URL"
          echo ""
          
          # Test health endpoint
          echo "Testing /api/v1/health endpoint..."
          HEALTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PREVIEW_URL/api/v1/health" || echo "000")
          if [ "$HEALTH_STATUS" = "200" ]; then
            echo "✅ Health check passed (200)"
          else
            echo "⚠️  Health check returned $HEALTH_STATUS (non-blocking)"
          fi
          
          # Test root endpoint
          echo "Testing root endpoint..."
          ROOT_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PREVIEW_URL/" || echo "000")
          if [ "$ROOT_STATUS" = "200" ] || [ "$ROOT_STATUS" = "404" ] || [ "$ROOT_STATUS" = "307" ]; then
            echo "✅ Root endpoint accessible ($ROOT_STATUS)"
          else
            echo "⚠️  Root endpoint returned $ROOT_STATUS (non-blocking)"
          fi
          
          # Test API docs (if available)
          echo "Testing API docs endpoint..."
          DOCS_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PREVIEW_URL/docs" || echo "000")
          if [ "$DOCS_STATUS" = "200" ]; then
            echo "✅ API docs accessible"
          else
            echo "ℹ️  API docs returned $DOCS_STATUS (optional)"
          fi
          
          echo ""
          echo "Smoke tests completed"
        continue-on-error: true
