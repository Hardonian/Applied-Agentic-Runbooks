name: Deploy Vercel Production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/deploy-vercel-preview.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  pre-deployment-checks:
    name: Pre-Deployment Checks
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=agent_factory --cov-report=xml
      
      - name: Run linting
        run: |
          ruff check agent_factory/ tests/
          black --check agent_factory/ tests/ || echo "⚠️  Formatting had issues (non-blocking)"
          mypy agent_factory/
      
      - name: Security scan
        run: |
          safety check || echo "⚠️  Safety check had issues (non-blocking)"
          bandit -r agent_factory/ -f json -o bandit-report.json || echo "⚠️  Bandit scan had issues (non-blocking)"
        continue-on-error: true
      
      - name: Check deployment readiness
        id: check
        run: |
          echo "should_deploy=true" >> $GITHUB_OUTPUT
          echo "✓ All pre-deployment checks passed"

  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    if: needs.pre-deployment-checks.outputs.should_deploy == 'true'
    outputs:
      production_url: ${{ steps.vercel-deploy.outputs.production_url || steps.check-credentials.outputs.production_url }}
      has_token: ${{ steps.check-credentials.outputs.has_token }}
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Vercel Credentials
        id: check-credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "production_url=https://[project-name].vercel.app" >> $GITHUB_OUTPUT
            echo "⚠️  VERCEL_TOKEN secret not set. Production deployment skipped."
            echo "To enable Vercel production deployments:"
            echo "1. Get Vercel token: https://vercel.com/account/tokens"
            echo "2. Add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID to GitHub Secrets"
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Setup Node.js
        if: steps.check-credentials.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Vercel CLI
        if: steps.check-credentials.outputs.has_token == 'true'
        run: npm install --global vercel@latest
      
      - name: Pull Vercel Environment Information
        if: steps.check-credentials.outputs.has_token == 'true'
        id: vercel-pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "❌ VERCEL_ORG_ID or VERCEL_PROJECT_ID secret not set."
            exit 1
          fi
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" || {
            echo "❌ Failed to pull Vercel config."
            echo "Verify VERCEL_ORG_ID and VERCEL_PROJECT_ID are correct."
            exit 1
          }
      
      - name: Build Project
        if: steps.check-credentials.outputs.has_token == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel build --prod --token="$VERCEL_TOKEN" || {
            echo "❌ Build failed. Check build logs above."
            exit 1
          }
      
      - name: Deploy to Vercel Production
        if: steps.check-credentials.outputs.has_token == 'true'
        id: vercel-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | head -1)
          
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "⚠️  Failed to extract deployment URL. Check Vercel logs above."
            DEPLOYMENT_URL="https://[project-name].vercel.app"
          fi
          
          echo "production_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "✓ Production deployed: $DEPLOYMENT_URL"
      
      - name: Deployment Summary
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-credentials.outputs.has_token }}" == "true" ]; then
            echo "**Deployment URL:** ${{ steps.vercel-deploy.outputs.production_url }}" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ℹ️ Skipped (VERCEL_TOKEN not configured)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  post-deployment-smoke-tests:
    name: Post-Deployment Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success() && needs.deploy-production.outputs.has_token == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Wait for deployment
        run: |
          echo "Waiting for production deployment to be ready..."
          sleep 45
      
      - name: Run smoke tests
        env:
          PRODUCTION_URL: ${{ needs.deploy-production.outputs.production_url }}
        run: |
          if [ -z "$PRODUCTION_URL" ] || [ "$PRODUCTION_URL" == "https://[project-name].vercel.app" ]; then
            echo "⚠️  Production URL not available. Skipping smoke tests."
            exit 0
          fi
          
          echo "Testing production deployment: $PRODUCTION_URL"
          echo ""
          
          TESTS_PASSED=0
          TESTS_FAILED=0
          
          # Test health endpoint
          echo "Testing /api/v1/health endpoint..."
          HEALTH_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PRODUCTION_URL/api/v1/health" || echo "000")
          HEALTH_BODY=$(curl -s --max-time 10 "$PRODUCTION_URL/api/v1/health" || echo "")
          if [ "$HEALTH_STATUS" = "200" ]; then
            echo "✅ Health check passed (200)"
            if echo "$HEALTH_BODY" | grep -q "healthy\|status"; then
              echo "   Response contains health status"
            fi
            ((TESTS_PASSED++))
          else
            echo "❌ Health check failed ($HEALTH_STATUS)"
            ((TESTS_FAILED++))
          fi
          
          # Test root endpoint
          echo "Testing root endpoint..."
          ROOT_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PRODUCTION_URL/" || echo "000")
          if [ "$ROOT_STATUS" = "200" ] || [ "$ROOT_STATUS" = "404" ] || [ "$ROOT_STATUS" = "307" ] || [ "$ROOT_STATUS" = "301" ]; then
            echo "✅ Root endpoint accessible ($ROOT_STATUS)"
            ((TESTS_PASSED++))
          else
            echo "⚠️  Root endpoint returned $ROOT_STATUS"
          fi
          
          # Test API docs endpoint
          echo "Testing API docs endpoint..."
          DOCS_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PRODUCTION_URL/docs" || echo "000")
          if [ "$DOCS_STATUS" = "200" ]; then
            echo "✅ API docs accessible"
            ((TESTS_PASSED++))
          else
            echo "⚠️  API docs returned $DOCS_STATUS"
          fi
          
          # Test OpenAPI JSON
          echo "Testing OpenAPI JSON endpoint..."
          OPENAPI_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PRODUCTION_URL/openapi.json" || echo "000")
          if [ "$OPENAPI_STATUS" = "200" ]; then
            echo "✅ OpenAPI JSON accessible"
            ((TESTS_PASSED++))
          else
            echo "ℹ️  OpenAPI JSON returned $OPENAPI_STATUS (optional)"
          fi
          
          # Test agents endpoint (should return 200 or 401/403)
          echo "Testing agents endpoint..."
          AGENTS_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PRODUCTION_URL/api/v1/agents/" || echo "000")
          if [ "$AGENTS_STATUS" = "200" ] || [ "$AGENTS_STATUS" = "401" ] || [ "$AGENTS_STATUS" = "403" ]; then
            echo "✅ Agents endpoint accessible ($AGENTS_STATUS)"
            ((TESTS_PASSED++))
          else
            echo "⚠️  Agents endpoint returned $AGENTS_STATUS"
          fi
          
          echo ""
          echo "=========================================="
          echo "Smoke Test Summary"
          echo "=========================================="
          echo "Passed: $TESTS_PASSED"
          echo "Failed: $TESTS_FAILED"
          echo ""
          
          if [ "$TESTS_FAILED" -gt 0 ]; then
            echo "⚠️  Some smoke tests failed. Review deployment."
          else
            echo "✅ All critical smoke tests passed!"
          fi
        continue-on-error: true
      
      - name: Health check summary
        if: always()
        run: |
          echo "## Health Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Smoke tests completed. Check logs above for details." >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [pre-deployment-checks, deploy-production, post-deployment-smoke-tests]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-deployment checks: ${{ needs.pre-deployment-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Production deployment: ${{ needs.deploy-production.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke tests: ${{ needs.post-deployment-smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Production URL:** ${{ needs.deploy-production.outputs.production_url || 'Not available' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
