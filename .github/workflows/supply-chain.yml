name: Supply Chain Security

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - run: uv run ruff check agent_factory/evaluation/arena agent_factory/api/ws agent_factory/api/routes/arena.py agent_factory/security/approval.py
      - run: >-
          uv run mypy --follow-imports=skip --strict
          --disable-error-code=untyped-decorator --disable-error-code=misc
          agent_factory/evaluation/arena agent_factory/api/ws
          agent_factory/api/routes/arena.py agent_factory/security/approval.py
          agent_factory/monitoring/tracing.py agent_factory/telemetry/otel_exporter.py
          agent_factory/telemetry/pcap.py
      - run: uv run python scripts/quality-ratchet.py

  image-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: agent-factory:${{ github.sha }}
      - uses: anchore/sbom-action@v0
        with:
          image: agent-factory:${{ github.sha }}
          format: spdx-json
          output-file: agent-factory.spdx.json
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-factory:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: {sarif_file: trivy-results.sarif}
      - uses: actions/upload-artifact@v4
        with: {name: sbom, path: agent-factory.spdx.json}
