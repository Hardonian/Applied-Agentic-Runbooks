services:
  api:
    environment:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-llama3.3}
    depends_on:
      ollama: {condition: service_started}
  ollama:
    image: ollama/ollama:0.4.0
    volumes: ["ollama-models:/root/.ollama"]
    ports: ["11434:11434"]
    restart: unless-stopped
volumes:
  ollama-models:
