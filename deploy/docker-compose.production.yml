name: agent-factory-production

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["uvicorn", "agent_factory.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://agent_factory:${POSTGRES_PASSWORD:-agent-factory}@postgres:5432/agent_factory
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS_BACKEND: redis
      ARENA_JOB_BACKEND: redis
      ARENA_ARTIFACT_DIR: /app/artifacts/arena
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes: ["arena-artifacts:/app/artifacts/arena"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  arena-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["agent-factory", "arena", "worker"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://agent_factory:${POSTGRES_PASSWORD:-agent-factory}@postgres:5432/agent_factory
      REDIS_URL: redis://redis:6379/0
      EVENT_BUS_BACKEND: redis
      ARENA_JOB_BACKEND: redis
      ARENA_ARTIFACT_DIR: /app/artifacts/arena
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes: ["arena-artifacts:/app/artifacts/arena"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

  studio:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ../agent_factory/ui/studio:/usr/share/nginx/html:ro
      - ./nginx/studio.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:8080"]
    depends_on: [api]
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg2://agent_factory:${POSTGRES_PASSWORD:-agent-factory}@postgres:5432/agent_factory
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_factory
      POSTGRES_USER: agent_factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent-factory}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_factory"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-agent-factory}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  arena-artifacts:
