apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-factory.fullname" . }}
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "agent-factory.labels" . | nindent 6 }}
  template:
    metadata:
      annotations: {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels: {{- include "agent-factory.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agent-factory.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints: {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      containers:
        - name: agent-factory
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports: [{name: http, containerPort: {{ .Values.containerPort }}}]
          env:
            {{- range $key, $value := .Values.env }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
          envFrom:
            - secretRef: {name: {{ .Values.existingSecret }}}
          livenessProbe:
            httpGet: {path: /live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: arena-artifacts, mountPath: /var/lib/agent-factory/arena}
            - {name: tmp, mountPath: /tmp}
          {{- if .Values.secretMount.enabled }}
            - {name: runtime-secrets, mountPath: {{ .Values.secretMount.path }}, readOnly: true}
          {{- end }}
      volumes:
        - name: arena-artifacts
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: {claimName: {{ include "agent-factory.fullname" . }}-artifacts}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- if .Values.secretMount.enabled }}
        - name: runtime-secrets
          secret: {secretName: {{ .Values.existingSecret }}}
      {{- end }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
