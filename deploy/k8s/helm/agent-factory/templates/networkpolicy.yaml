{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agent-factory.fullname" . }}
spec:
  podSelector:
    matchLabels: {{- include "agent-factory.labels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{protocol: TCP, port: {{ .Values.containerPort }}}]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 4318}
    - to:
        - namespaceSelector: {}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
{{- end }}
