apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-factory.fullname" . }}
  labels: {{- include "agent-factory.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "agent-factory.labels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
