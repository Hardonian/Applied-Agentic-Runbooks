{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "agent-factory.fullname" . }}
spec:
  selector:
    matchLabels: {{- include "agent-factory.labels" . | nindent 6 }}
  endpoints:
    - {port: http, path: /metrics, interval: {{ .Values.monitoring.serviceMonitor.interval }}}
{{- end }}
