[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-factory"
version = "0.2.0"
description = "A composable, extensible platform for building, deploying, and monetizing AI agents"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0"}
authors = [
    {name = "Scott Hardie", email = "scottrmhardie@gmail.com"},
    {name = "Agent Factory", email = "support@agentfactory.io"},
]
keywords = ["ai", "agents", "automation", "llm", "openai", "anthropic", "education", "higher-education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]

dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "schedule>=1.2.0",
    "duckduckgo-search>=3.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "prometheus-client>=0.18.0",
    "python-json-logger>=2.0.0",
    "pyjwt>=2.8.0",
    "stripe>=7.0.0",
    "passlib>=1.7.4",
    # passlib 1.7.x is not compatible with bcrypt 5's password-length API.
    "bcrypt>=4.0.0,<5.0.0",
    "packaging>=23.0",
    "supabase>=2.0.0",
    "email-validator>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/agentfactory/platform"
Documentation = "https://docs.agentfactory.io"
Repository = "https://github.com/agentfactory/platform"
Issues = "https://github.com/agentfactory/platform/issues"
Marketplace = "https://marketplace.agentfactory.io"
Partnerships = "https://www.mheducation.ca/partnerships"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
    "isort>=5.13.0",
    "bandit>=1.7.5",
    "safety>=2.3.5",
    "httpx>=0.24.0",
]
e2e = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.1.0",
    "httpx>=0.24.0",
]
demo = [
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "pandas>=2.0.0",
]

[project.scripts]
agent-factory = "agent_factory.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_factory*"]

[tool.setuptools.package-data]
agent_factory = ["py.typed", "ui/studio/*", "ui/embed/*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
