[pytest]
markers =
    unit: Fast unit tests with no external I/O (run in CI)
    integration: Integration tests requiring external services (run nightly)
    slow: Slow tests taking >1 second (run nightly)
    e2e: End-to-end tests requiring full stack (run in e2e workflow)
    asyncio: Async test marker
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
filterwarnings =
    ignore:.*utcnow.*:DeprecationWarning
    ignore:.*declarative_base.*:sqlalchemy.exc.MovedIn20Warning
    ignore:.*Pydantic V1 style.*:pydantic.warnings.PydanticDeprecatedSince20
    ignore:.*on_event is deprecated.*:DeprecationWarning
    ignore:.*pythonjsonlogger.*:DeprecationWarning
    ignore:.*duckduckgo_search.*:RuntimeWarning
